name: Pi CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - web-app/**
      - .github/workflows/elixir-ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi:
    name: Pi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run check
