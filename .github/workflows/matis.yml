name: Matis CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matis:
    name: Matis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repository
          persist-credentials: false
      - name: Install latest Matis release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/matis"
          gh release download --repo LeonFelipeCordero/matis \
            --pattern 'matis-*-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/matis"
          cd "$RUNNER_TEMP/matis"
          sha256sum --check SHA256SUMS
          tar -xzf matis-*-x86_64-unknown-linux-gnu.tar.gz matis
          echo "$RUNNER_TEMP/matis" >> "$GITHUB_PATH"
      - name: Require zero findings across the entire repository
        shell: bash
        run: |
          set -o pipefail
          matis check --f repository --format json | tee "$RUNNER_TEMP/matisReport.json"
          jq -e '.findings == []' "$RUNNER_TEMP/matisReport.json"
