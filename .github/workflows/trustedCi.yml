name: Trusted CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Trusted checks
    # The host authorizes the live run; this label only routes the job.
    runs-on: matato-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    if: >-
      github.repository == 'LeonFelipeCordero/matato-skills' &&
      github.actor_id == github.repository_owner_id &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main'))
    env:
      CI: 'true'
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '4'
    defaults:
      run:
        working-directory: repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: repository
          persist-credentials: false
      - name: Analyze and check the clean checkout
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          matis report -f repository
          matis check --folder repository --format json | tee "$RUNNER_TEMP/matisReport.json"
          jq -e '.findings == []' "$RUNNER_TEMP/matisReport.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: repository/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
