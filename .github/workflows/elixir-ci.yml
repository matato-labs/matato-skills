name: Elixir CI

on:
  pull_request:
    branches: [main]
    paths:
      - web-app/**
      - .github/workflows/elixir-ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes inotify-tools
      - uses: oven-sh/setup-bun@v2
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "28.1.1"
      - uses: actions/cache@v4
        with:
          path: web-app/deps
          key: elixir-deps-1.20.4-otp-28.1.1-${{ runner.os }}-${{ hashFiles('web-app/mix.lock') }}
      - uses: actions/cache@v4
        with:
          path: web-app/_build
          key: elixir-build-1.20.4-otp-28.1.1-${{ runner.os }}-${{ hashFiles('web-app/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: MIX_ENV=test mix do compile --warnings-as-errors + test --warnings-as-errors
