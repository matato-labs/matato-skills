name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matis:
    name: matis
    runs-on: [self-hosted, linux, x64, matato-local]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Matis release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matis"
          gh release download v0.1.7 --repo "$GITHUB_REPOSITORY_OWNER/matis" \
            --pattern 'matis-v0.1.7-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP/matis"
          cd "$RUNNER_TEMP/matis"
          sha256sum --check SHA256SUMS
          tar -xzf matis-v0.1.7-x86_64-unknown-linux-gnu.tar.gz matis
          echo "$RUNNER_TEMP/matis" >> "$GITHUB_PATH"
      - name: Analyze and check the project
        shell: bash
        run: |
          set -euo pipefail
          matis report -f .
          matis check --folder . --format json | tee "$RUNNER_TEMP/matisReport.json"
          jq -e '.findings == []' "$RUNNER_TEMP/matisReport.json"

  pi:
    name: Pi
    runs-on: [self-hosted, linux, x64, matato-local]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run check

  ci:
    name: ci
    if: always()
    needs: [matis, pi]
    runs-on: [self-hosted, linux, x64, matato-local]
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$RESULTS"
