name: Atlas CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    name: Atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repository
          persist-credentials: false
      - name: Checkout Atlas
        uses: actions/checkout@v4
        with:
          repository: LeonFelipeCordero/atlas
          ref: main
          path: atlas
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas/atlas-rust
      - name: Build Atlas
        run: cargo build --manifest-path atlas/atlas-rust/Cargo.toml --release --locked --bin atlas
      - name: Require zero findings across the entire repository
        shell: bash
        run: |
          set -o pipefail
          atlas/atlas-rust/target/release/atlas check --f repository --format json | tee "$RUNNER_TEMP/atlasReport.json"
          jq -e '.findings == []' "$RUNNER_TEMP/atlasReport.json"
