name: Matis CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matis:
    name: Matis
    runs-on: [self-hosted, linux, x64, matato-local]
    steps:
      - uses: actions/checkout@v4
        with:
          path: repository
          persist-credentials: false
      - name: Verify bundled Matis
        run: test "$(matis --version)" = 'matis 0.1.7'
      - name: Require zero findings across the entire repository
        shell: bash
        run: |
          set -o pipefail
          matis check --f repository --format json | tee "$RUNNER_TEMP/matisReport.json"
          jq -e '.findings == []' "$RUNNER_TEMP/matisReport.json"
